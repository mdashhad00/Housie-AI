name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir -p _site
          # Copy root frontend files
          cp index.html _site/
          cp -r speech-assist _site/
          cp -r static/* _site/ 2>/dev/null || true
          cp -r public/* _site/ 2>/dev/null || true
          # Ensure speech-assist is present in site root
          mkdir -p _site/speech-assist
          cp speech-assist/index.html _site/speech-assist/index.html
          # Ensure .nojekyll so files with underscores aren't ignored
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
