<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Housie AI — Your Smart AI Companion</title>
  <meta name="description" content="Housie AI: SymPy-powered math solver with 30+ science topics, bilingual English/Hinglish support. Now with Whisper.cpp voice input & TTS." />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Housie AI" />

  <!-- React + Babel CDN for React without Node.js -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }

    /* ═══════════════════════════════════════════
       MINECRAFT HD BACKGROUND + CANVAS CLOUDS
    ═══════════════════════════════════════════ */
    .bg-container {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #1e3a5f;
    }
    .bg-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      filter: brightness(0.85) contrast(1.1) saturate(1.15);
      transform: scale(1.02);
    }
    #cloud-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    /* ═══════════════════════════════════════════
       MAIN LAYOUT
    ═══════════════════════════════════════════ */
    #root {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      gap: 24px; padding: 20px 28px;
    }

    /* ═══════════════════════════════════════════
       LIQUID GLASSMORPHISM
    ═══════════════════════════════════════════ */
    .glass {
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(40px) saturate(1.6);
      -webkit-backdrop-filter: blur(40px) saturate(1.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* ═══════════════════════════════════════════
       ROBOT PANEL (LEFT)
    ═══════════════════════════════════════════ */
    .robot-panel {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      animation: fadeLeft 0.8s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes fadeLeft { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }

    .robot-glass {
      padding: 24px 22px 18px; display: flex; flex-direction: column;
      align-items: center; gap: 10px; width: 200px;
    }

    .robot-speech {
      font-size: 11px; color: #94a3b8; text-align: center;
      padding: 6px 12px; background: rgba(255,255,255,0.06);
      border-radius: 12px; opacity: 0; transform: translateY(8px);
      transition: all 0.4s ease;
    }
    .robot-speech.show { opacity: 1; transform: translateY(0); }

    .robot-body {
      width: 120px; height: 150px; transition: transform 0.3s;
    }
    .robot-body.talking { animation: robotBounce 0.5s ease infinite alternate; }
    @keyframes robotBounce { from{transform:translateY(0)} to{transform:translateY(-6px)} }

    .robot-name {
      font-size: 18px; font-weight: 800; letter-spacing: 3px;
      background: linear-gradient(135deg, #a78bfa 0%, #2dd4bf 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .robot-status {
      font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 6px;
    }
    .dot {
      width: 7px; height: 7px; background: #2dd4bf; border-radius: 50%;
      box-shadow: 0 0 8px #2dd4bf; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ═══════════════════════════════════════════
       CHAT PANEL (RIGHT)
    ═══════════════════════════════════════════ */
    .chat-panel {
      flex: 1; max-width: 720px; height: 92vh;
      display: flex; flex-direction: column;
      animation: fadeRight 0.8s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes fadeRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }

    .header {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo-ring {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a78bfa, #2dd4bf);
      display: flex; align-items: center; justify-content: center;
      animation: logoSpin 6s linear infinite;
    }
    @keyframes logoSpin { from{filter:hue-rotate(0deg)} to{filter:hue-rotate(360deg)} }
    .logo-icon { font-size: 22px; }
    .header-title { font-size: 17px; font-weight: 700; color: #f1f5f9; }
    .header-sub { font-size: 11px; color: #64748b; }
    .lang-badge {
      margin-left: auto; font-size: 11px; padding: 4px 10px;
      background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.3);
      border-radius: 12px; color: #a5b4fc;
    }
    .sympy-badge {
      font-size: 10px; padding: 3px 8px;
      background: rgba(45,212,191,0.15); border: 1px solid rgba(45,212,191,0.3);
      border-radius: 10px; color: #2dd4bf;
    }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 12px;
      scrollbar-width: thin; scrollbar-color: rgba(100,116,139,0.3) transparent;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 8px; }

    .msg-row {
      display: flex; gap: 10px; align-items: flex-start;
      animation: msgIn 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes msgIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .avatar.ai { background: linear-gradient(135deg, #6366f1, #2dd4bf); }
    .avatar.user { background: linear-gradient(135deg, #f472b6, #a78bfa); }

    .msg-content { max-width: 80%; }
    .bubble {
      padding: 12px 16px; border-radius: 18px; font-size: 14px;
      line-height: 1.65; word-wrap: break-word;
    }
    .bubble.ai {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      border-top-left-radius: 4px; color: #e2e8f0;
    }
    .bubble.user {
      background: linear-gradient(135deg, rgba(99,102,241,0.35), rgba(167,139,250,0.25));
      border: 1px solid rgba(167,139,250,0.2);
      border-top-right-radius: 4px; color: #f1f5f9;
    }
    .bubble strong { color: #a5b4fc; font-weight: 600; }
    .timestamp { font-size: 10px; color: #475569; margin-top: 4px; padding: 0 6px; }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 5px; padding: 4px 2px; align-items: center; }
    .typing-dot {
      width: 7px; height: 7px; background: #a78bfa; border-radius: 50%;
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

    .math-result {
      display: inline-block; font-family: 'JetBrains Mono', monospace;
      font-size: 22px; font-weight: 700; color: #2dd4bf; margin: 6px 0;
      text-shadow: 0 0 20px rgba(45,212,191,0.4);
    }

    /* Action Card for WhatsApp & App Launcher */
    .action-card {
      margin-top: 10px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }
    .action-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-icon {
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .action-card-info {
      flex: 1;
      min-width: 0;
    }
    .action-app-name {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }
    .action-app-desc {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .action-preview-text {
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #22c55e;
      border-radius: 6px;
      font-size: 12px;
      color: #e2e8f0;
      font-style: italic;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      color: #ffffff !important;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
    }
    .action-btn.whatsapp-btn {
      background: linear-gradient(135deg, #25D366, #128C7E);
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
    }
    .action-btn.whatsapp-btn:hover {
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.55);
    }

    /* Welcome screen */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      padding: 30px; text-align: center;
    }
    .welcome-title {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #2dd4bf, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .welcome-sub { font-size: 13px; color: #94a3b8; max-width: 420px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
    .chip {
      padding: 8px 16px; border-radius: 20px; font-size: 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1; cursor: pointer; transition: all 0.2s;
    }
    .chip:hover {
      background: rgba(99,102,241,0.2); border-color: rgba(99,102,241,0.4);
      color: #a5b4fc; transform: translateY(-2px);
    }

    /* Input */
    .input-area {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; gap: 10px; align-items: flex-end;
    }
    .input-area textarea {
      flex: 1; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 12px 16px;
      color: #f1f5f9; font-size: 14px; font-family: 'Inter', sans-serif;
      resize: none; max-height: 100px; outline: none;
      transition: border-color 0.3s;
    }
    .input-area textarea::placeholder { color: #475569; }
    .input-area textarea:focus { border-color: rgba(99,102,241,0.5); }

    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      color: #fff; font-size: 18px; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
      font-weight: 600;
    }
    .send-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
    .send-btn:active:not(:disabled) { transform: scale(0.95); }
    .send-btn:disabled {
      opacity: 0.55; cursor: not-allowed; transform: none !important; box-shadow: none !important;
    }
    .input-area textarea:disabled {
      opacity: 0.65; cursor: not-allowed; background: rgba(255, 255, 255, 0.03);
    }

    /* ═══════════════════════════════════════════
       VOICE INPUT — MIC BUTTON
    ═══════════════════════════════════════════ */
    .mic-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0; font-size: 18px; cursor: pointer;
      transition: all 0.25s; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .mic-btn:hover:not(:disabled) {
      background: rgba(99,102,241,0.25); border-color: rgba(99,102,241,0.5);
      transform: scale(1.08);
    }
    .mic-btn.recording {
      background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.6);
      animation: micPulse 0.9s ease-in-out infinite;
    }
    .mic-btn.transcribing {
      background: rgba(251,191,36,0.15); border-color: rgba(251,191,36,0.5);
      animation: micSpin 1s linear infinite;
    }
    @keyframes micPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0.35); }
    }
    @keyframes micSpin {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }
    .mic-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Voice status badge */
    .voice-status {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; background: rgba(15,23,42,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; color: #f1f5f9; font-size: 12px; font-weight: 600;
      z-index: 100; pointer-events: none;
      animation: voiceStatusIn 0.3s ease;
    }
    @keyframes voiceStatusIn { from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

    /* Whisper model loader bar */
    .whisper-loader {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #a78bfa, #2dd4bf);
      transform-origin: left;
      animation: loaderPulse 1.5s ease-in-out infinite;
    }
    @keyframes loaderPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* Whisper info popup */
    .whisper-info {
      position: fixed; bottom: 80px; right: 24px;
      padding: 10px 16px; background: rgba(15,23,42,0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 14px; color: #94a3b8; font-size: 11px;
      max-width: 240px; line-height: 1.5;
      z-index: 200;
    }
    .whisper-info strong { color: #a5b4fc; }

    /* TTS toggle button */
    .tts-btn {
      padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06); color: #94a3b8;
      font-size: 13px; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .tts-btn:hover { background: rgba(45,212,191,0.12); border-color: rgba(45,212,191,0.3); color: #2dd4bf; }
    .tts-btn.active { background: rgba(45,212,191,0.15); border-color: rgba(45,212,191,0.4); color: #2dd4bf; }

    /* Model selector */
    .model-select {
      background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #94a3b8; font-size: 11px; padding: 3px 6px;
      cursor: pointer; outline: none;
    }
    .model-select:focus { border-color: rgba(99,102,241,0.4); }

    /* Device control result card */
    .device-card {
      margin-top: 10px; padding: 14px 16px;
      background: linear-gradient(135deg, rgba(15,23,42,0.8), rgba(30,41,59,0.7));
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 14px; display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.2);
    }
    .device-card-row { display: flex; align-items: center; gap: 10px; }
    .device-card-icon {
      font-size: 22px; width: 40px; height: 40px; border-radius: 12px;
      background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.25);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .device-card-label { font-size: 13px; font-weight: 700; color: #f1f5f9; }
    .device-card-value { font-size: 11px; color: #94a3b8; margin-top: 1px; }
    .device-card-btn {
      padding: 8px 16px; border: none; border-radius: 10px; cursor: pointer;
      font-size: 12px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      transition: all 0.2s; box-shadow: 0 3px 10px rgba(99,102,241,0.3);
    }
    .device-card-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(99,102,241,0.5); }
    .device-card-btn.green { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 3px 10px rgba(34,197,94,0.3); }
    .device-card-btn.red { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 3px 10px rgba(239,68,68,0.3); }
    .device-card-btn.teal { background: linear-gradient(135deg, #2dd4bf, #0d9488); box-shadow: 0 3px 10px rgba(45,212,191,0.3); }

    /* App Download Card */
    .download-card {
      margin-top: 12px; padding: 18px;
      background: linear-gradient(135deg, rgba(15,23,42,0.92), rgba(30,41,59,0.85));
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; gap: 14px;
    }
    .download-card-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;
    }
    .download-card-title {
      display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: #f8fafc;
    }
    .download-version-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      background: rgba(45,212,191,0.15); border: 1px solid rgba(45,212,191,0.35); color: #2dd4bf;
    }
    .download-os-banner {
      font-size: 11px; color: #a5b4fc; background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25); border-radius: 8px; padding: 6px 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .platform-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .platform-card {
      padding: 12px; border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column; gap: 8px;
      transition: all 0.25s ease;
      position: relative;
    }
    .platform-card:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(167,139,250,0.4);
      transform: translateY(-2px);
    }
    .platform-card.recommended {
      background: linear-gradient(135deg, rgba(99,102,241,0.18), rgba(45,212,191,0.12));
      border-color: rgba(45,212,191,0.5);
      box-shadow: 0 0 16px rgba(45,212,191,0.18);
    }
    .recommended-pill {
      position: absolute; top: -7px; right: 10px;
      background: linear-gradient(135deg, #6366f1, #2dd4bf);
      color: #fff; font-size: 9px; font-weight: 800; padding: 1px 7px;
      border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .platform-head {
      display: flex; align-items: center; gap: 8px;
    }
    .platform-icon {
      font-size: 22px; width: 34px; height: 34px; border-radius: 10px;
      background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;
    }
    .platform-name {
      font-size: 13px; font-weight: 700; color: #f1f5f9; display: flex; align-items: center; gap: 6px;
    }
    .platform-ext {
      font-size: 10px; color: #94a3b8; background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px;
    }
    .platform-desc {

<script>
(function initClouds() {
  const canvas = document.getElementById('cloud-canvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = canvas.parentElement.offsetWidth; canvas.height = canvas.parentElement.offsetHeight; }
  resize(); window.addEventListener('resize', resize);

  function drawPuff(x, y, r, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,255,255,${alpha})`);
    g.addColorStop(0.55, `rgba(255,255,255,${alpha * 0.6})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  const clouds = [
    {x:-300,y:canvas.height*0.08,speed:0.28,scale:1.1,alpha:0.55},
    {x:800,y:canvas.height*0.14,speed:0.18,scale:0.75,alpha:0.45},
    {x:1400,y:canvas.height*0.05,speed:0.22,scale:1.3,alpha:0.6},
    {x:300,y:canvas.height*0.19,speed:0.14,scale:0.6,alpha:0.35},
    {x:2100,y:canvas.height*0.10,speed:0.20,scale:0.9,alpha:0.5},
  ];
  const PUFFS = [{dx:0,dy:0,r:62},{dx:-70,dy:12,r:50},{dx:70,dy:10,r:50},{dx:-38,dy:-32,r:42},{dx:38,dy:-30,r:42},{dx:-115,dy:22,r:36},{dx:115,dy:22,r:36},{dx:0,dy:-52,r:34}];

  function drawCloud(c) {
    const sc = c.scale, W = canvas.width;
    const edgeFade = Math.min(1, Math.min((c.x+200)/200, (W-c.x+200)/200));
    const alpha = c.alpha * Math.max(0, edgeFade);
    if (alpha <= 0) return;
    PUFFS.forEach(p => drawPuff(c.x + p.dx*sc, c.y + p.dy*sc, p.r*sc, alpha));
  }

  let lastTime = 0;
  function animate(ts) {
    const dt = Math.min(ts - lastTime, 50); lastTime = ts;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    clouds.forEach(c => { c.x += c.speed*(dt/16); if(c.x > canvas.width+350) c.x = -350; drawCloud(c); });
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(animate); });
})();
</script>

// ─── Device Command Executor ───
async function executeDeviceCmd(action, setMessages) {
  const { deviceCmd, copyText, notifyMsg, shareText, url } = action;
  const t = timeNow();

  if (deviceCmd === 'copy') {
    try {
      await navigator.clipboard.writeText(copyText);
      setMessages(p => [...p, { role:'ai', text:`✅ **Copied!** "${copyText}" is now in your clipboard. Press **Ctrl+V** to paste anywhere!`, time: t }]);
    } catch { setMessages(p => [...p, { role:'ai', text:`❌ Clipboard access denied. Please allow clipboard permission and try again.`, time: t }]); }
  }

  else if (deviceCmd === 'notify') {
    if (!('Notification' in window)) {
      setMessages(p => [...p, { role:'ai', text:`❌ This browser doesn't support notifications.`, time: t }]);
    } else if (Notification.permission === 'granted') {
      new Notification('Housie AI 🧠', { body: notifyMsg, icon: '/minecraft_bg.png' });
      setMessages(p => [...p, { role:'ai', text:`✅ Notification sent: **"${notifyMsg}"**`, time: t }]);
    } else {
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        new Notification('Housie AI 🧠', { body: notifyMsg, icon: '/minecraft_bg.png' });
        setMessages(p => [...p, { role:'ai', text:`✅ Notification sent: **"${notifyMsg}"**`, time: t }]);
      } else {
        setMessages(p => [...p, { role:'ai', text:`❌ Notification permission denied. Please allow notifications in your browser settings.`, time: t }]);
      }
    }
  }

  else if (deviceCmd === 'vibrate') {
    if (navigator.vibrate) {
      navigator.vibrate([200, 100, 200, 100, 400]);
      setMessages(p => [...p, { role:'ai', text:`📳 Device vibrated! ✅ (pattern: 200ms-pause-200ms-pause-400ms)`, time: t }]);
    } else {
      setMessages(p => [...p, { role:'ai', text:`❌ Vibration not supported on this device/browser. Works on Android phones in Chrome!`, time: t }]);
    }
  }

  else if (deviceCmd === 'battery') {
    try {
      const bat = await navigator.getBattery();
      const pct = Math.round(bat.level * 100);
      const charging = bat.charging ? '⚡ Charging' : '🔌 Not charging';
      const eta = bat.charging && bat.chargingTime !== Infinity
        ? ` • Full in ~${Math.round(bat.chargingTime/60)}min`
        : (!bat.charging && bat.dischargingTime !== Infinity)
        ? ` • ~${Math.round(bat.dischargingTime/60)}min left`
        : '';
      setMessages(p => [...p, { role:'ai', text:`🔋 **Battery: ${pct}%**\n${charging}${eta}\n\n${pct > 70 ? '✅ Battery is good!' : pct > 30 ? '⚠️ Battery getting low.' : '🛑 Plug in now!'}`, time: t }]);
    } catch {
      setMessages(p => [...p, { role:'ai', text:`❌ Battery API not available on this device/browser. Works on Android Chrome!`, time: t }]);
    }
  }

  else if (deviceCmd === 'location') {
    setMessages(p => [...p, { role:'ai', text:`📍 Getting your location... (please allow location permission)`, time: t }]);
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude: lat, longitude: lng, accuracy: acc } = pos.coords;
        const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
        setMessages(p => [...p, {
          role:'ai',
          text: `📍 **Your Location:**\nLat: **${lat.toFixed(5)}** | Lng: **${lng.toFixed(5)}**\nAccuracy: ±${Math.round(acc)}m`,
          action: { type:'open_app', app:'Google Maps', icon:'🗺️', url: mapsUrl, label:'🗺️ Open in Maps' },
          time: t
        }]);
      },
      err => setMessages(p => [...p, { role:'ai', text:`❌ Location denied or unavailable: ${err.message}`, time: t }]),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  else if (deviceCmd === 'wakelock') {
    try {
      if ('wakeLock' in navigator) {
        await navigator.wakeLock.request('screen');
        setMessages(p => [...p, { role:'ai', text:`💡 **Screen Wake Lock active!** Your screen won't sleep as long as this tab is open. ✅`, time: t }]);
      } else {
        setMessages(p => [...p, { role:'ai', text:`❌ Wake Lock API not supported on this browser. Try Chrome on Android/Desktop!`, time: t }]);
      }
    } catch(e) {
      setMessages(p => [...p, { role:'ai', text:`❌ Wake Lock failed: ${e.message}`, time: t }]);
    }
  }

  else if (deviceCmd === 'share') {
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Housie AI', text: shareText, url: window.location.href });
        setMessages(p => [...p, { role:'ai', text:`✅ Content shared successfully!`, time: t }]);
      } catch(e) {
        if (e.name !== 'AbortError') setMessages(p => [...p, { role:'ai', text:`❌ Share failed: ${e.message}`, time: t }]);
      }
    } else {
      try {
        await navigator.clipboard.writeText(shareText);
        setMessages(p => [...p, { role:'ai', text:`📋 Web Share not available \u2014 copied to clipboard instead: **"${shareText}"**`, time: t }]);
      } catch { setMessages(p => [...p, { role:'ai', text:`❌ Share not supported on this browser.`, time: t }]); }
    }
  }

  else if (deviceCmd === 'call' && url) {
    window.location.href = url;
  }

  else if (deviceCmd === 'email' && url) {
    window.location.href = url;
  }

  else if (deviceCmd === 'camera' && url) {
    window.open(url, '_blank');
  }
}

  if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
  if (/macintosh|mac os x/i.test(ua)) return 'mac';
  if (/windows|win32|win64/i.test(ua)) return 'windows';

  return 'windows';
}

  const isHinglish = /kya|hai|bhai|yaar|kaise|kaisa|kuch|nahi|haan|kaun|kisne|banaya|sunao|bol/.test(text);

    /\b(?:app|application|apk)\b.*\b(?:download|link|links|install|get)\b/i.test(text) ||
    /\b(?:windows|mac|macos|linux|android)\s*(?:app|version|apk|setup|installer|download)\b/i.test(text) ||

    /(?:is\s*there\s*an\s*app|do\s*you\s*have\s*an\s*app|provide\s*(?:the\s*)?download\s*link)/i.test(text)

      .replace(/^(?:open\s+)?whatsapp\s+and\s+(?:send|text|msg|message)\b/gi, '')
      .replace(/^(?:open|kholo|launch)\s+whatsapp\b/gi, '')
      .replace(/^whatsapp\s+(?:open\s+karo|kholo)\b/gi, '');

    if (phone) {

let whisperCtx = null;
let whisperLoadingPromise = null;
const WHISPER_MODELS = {
  'tiny.en': { name: 'tiny.en (75MB, English)', url: 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin', size: '75MB' },

};

async function loadWhisperModel(modelKey, onProgress) {
  if (whisperCtx) return whisperCtx;

  const modelInfo = WHISPER_MODELS[modelKey] || WHISPER_MODELS['tiny.en'];
  const cacheKey = 'whisper_model_' + modelKey;

  whisperLoadingPromise = (async () => {
    try {
      // Check if Module (Whisper WASM) is loaded

        throw new Error('Whisper WASM not loaded');
      }

      // Try IndexedDB cache first
      let modelData = null;
      try {
        const db = await new Promise((res, rej) => {
          const r = indexedDB.open('WhisperCache', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('models');
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
        const tx = db.transaction('models', 'readonly');
        const cached = await new Promise((res, rej) => {
          const r = tx.objectStore('models').get(cacheKey);
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
        if (cached) { modelData = cached; }
      } catch (e) {}

      // Download if not cached
      if (!modelData) {
        onProgress && onProgress({ phase: 'downloading', pct: 0 });
        const resp = await fetch(modelInfo.url);
        const reader = resp.body.getReader();
        const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
        let received = 0;
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          if (total) onProgress && onProgress({ phase: 'downloading', pct: Math.round(received / total * 90) });
        }
        modelData = new Uint8Array(received);
        let offset = 0;
        for (const chunk of chunks) { modelData.set(chunk, offset); offset += chunk.length; }
        onProgress && onProgress({ phase: 'caching', pct: 95 });
        // Save to IndexedDB
        try {
          const db2 = await new Promise((res, rej) => {
            const r = indexedDB.open('WhisperCache', 1);
            r.onupgradeneeded = () => r.result.createObjectStore('models');
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
          });
          const tx2 = db2.transaction('models', 'readwrite');
          tx2.objectStore('models').put(modelData, cacheKey);
          await new Promise((res, rej) => { tx2.oncomplete = res; tx2.onerror = rej; });
        } catch (e) {}
      }

      onProgress && onProgress({ phase: 'loading', pct: 98 });
      await Module.init('ggml-tiny.en', modelData);
      whisperCtx = Module;
      onProgress && onProgress({ phase: 'ready', pct: 100 });
      return whisperCtx;
    } catch (err) {
      whisperLoadingPromise = null;
      throw err;
    }
  })();

  return whisperLoadingPromise;
}

async function transcribeAudioBuffer(float32Data, modelKey, onProgress) {
  try {
    await loadWhisperModel(modelKey, onProgress);
    if (!whisperCtx || !whisperCtx.full) throw new Error('Whisper not ready');
    const result = await whisperCtx.full({ audio: float32Data, language: modelKey === 'base' ? 'auto' : 'en', translate: false, beam_size: 5 });
    return result && result.result ? result.result.map(s => s.text).join(' ').trim() : '';
  } catch (err) {
    return null; // signals fallback to Web Speech API
  }
}

// ─── Main App Component ───
function HousieApp() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const [talking, setTalking] = useState(false);
  const [speech, setSpeech] = useState('');
  const [showSpeech, setShowSpeech] = useState(false);
  const [langMode, setLangMode] = useState('🌐 English');
  const [cooldown, setCooldown] = useState(0);

  // ── Voice I/O State ──
  const [isRecording, setIsRecording] = useState(false);
  const [voiceState, setVoiceState] = useState('idle'); // idle | recording | transcribing
  const [ttsEnabled, setTtsEnabled] = useState(false);
  const [whisperModel, setWhisperModel] = useState('tiny.en');
  const [whisperStatus, setWhisperStatus] = useState('idle'); // idle | loading | ready | error
  const [whisperPct, setWhisperPct] = useState(0);
  const mediaRecorderRef = useRef(null);
  const audioChunksRef = useRef([]);
  const recognitionRef = useRef(null);

  const messagesEndRef = useRef(null);
  const inputRef = useRef(null);

  const scrollToBottom = () => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  };

  useEffect(() => { scrollToBottom(); }, [messages, isTyping]);

  useEffect(() => {
    if (cooldown <= 0) return;
    const timer = setInterval(() => {
      setCooldown(prev => Math.max(0, prev - 1));
    }, 1000);
    return () => clearInterval(timer);
  }, [cooldown]);

  // ── TTS: speak AI responses ──
  const speakText = React.useCallback((text) => {
    if (!ttsEnabled || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const clean = text
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/#+\s*/g, '')
      .replace(/🚀|🧠|💬|⚡|🎵|▶️|😊|🤔|😂|🔥|✅|🛑|⏳|📐|🎯|🌐|🇮🇳|👤|📸|🔢|📷|✉️|🗺️|🐙|🤖|🍿|📦|🛍️|🐦|🎮|✈️|👽|📝|🖌️|🎨|📱|🔍|💡|🌟|⚛️|🍝|🐛|🔬|🦠|🧬|🫀|📡|⚙️|🏋️|💊|🧪|🔭|🌍|👁️|📚|🎓/gu, '')
      .replace(/\n/g, '. ')
      .slice(0, 300);
    if (!clean.trim()) return;
    const utt = new SpeechSynthesisUtterance(clean);
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      v.name.toLowerCase().includes('india') ||
      v.name.toLowerCase().includes('ravi') ||
      v.name.toLowerCase().includes('english (india)') ||
      v.lang === 'en-IN'
    ) || voices.find(v => v.lang === 'en-US') || voices[0];
    if (preferred) utt.voice = preferred;
    utt.rate = 0.95;
    utt.pitch = 1.05;
    window.speechSynthesis.speak(utt);
  }, [ttsEnabled]);

  // ── Voice Recording & STT ──
  const startRecording = React.useCallback(async () => {
    if (isRecording || isTyping) return;
    setIsRecording(true);
    setVoiceState('recording');

    // --- Path A: Web Speech API (Chrome/Edge/Safari — no download, instant) ---
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      try {
        const rec = new SpeechRec();
        recognitionRef.current = rec;
        rec.continuous = false;
        rec.interimResults = false;
        rec.lang = 'en-US';
        rec.onresult = (evt) => {
          const transcript = evt.results[0][0].transcript.trim();
          if (transcript) sendMessage(transcript);
          setIsRecording(false);
          setVoiceState('idle');
          recognitionRef.current = null;
        };
        rec.onerror = (e) => {
          console.warn('Web Speech error:', e.error);
          setIsRecording(false);
          setVoiceState('idle');
          recognitionRef.current = null;
        };
        rec.onend = () => {
          setIsRecording(false);
          setVoiceState('idle');
          recognitionRef.current = null;
        };
        rec.start();
        setTimeout(() => { try { rec.stop(); } catch(e){} }, 30000);
        return;
      } catch(e) {
        console.warn('Web Speech failed, trying Whisper...', e);
      }
    }

    // --- Path B: Whisper WASM (Firefox or when Web Speech unavailable) ---
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioChunksRef.current = [];

      let mimeType = 'audio/webm;codecs=opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/webm';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

      const mr = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      mediaRecorderRef.current = mr;
      mr.ondataavailable = e => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
      mr.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setVoiceState('transcribing');
        try {
          const blob = new Blob(audioChunksRef.current, { type: mimeType || 'audio/webm' });
          const arrayBuf = await blob.arrayBuffer();
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
          const decoded = await audioCtx.decodeAudioData(arrayBuf);
          const float32 = decoded.getChannelData(0);
          const transcript = await transcribeAudioBuffer(float32, whisperModel, progress => {
            if (progress.phase === 'downloading') setWhisperPct(progress.pct);
          });
          if (transcript) sendMessage(transcript);
        } catch (err) {
          console.error('Whisper transcription error:', err);
        } finally {
          setIsRecording(false);
          setVoiceState('idle');
        }
      };
      mr.start();
      setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 30000);
    } catch (err) {
      setIsRecording(false);
      setVoiceState('idle');
      alert('Microphone permission denied. Please allow microphone access and try again.');
    }
  }, [isRecording, isTyping, whisperModel]);

  const stopRecording = React.useCallback(() => {
    if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch(e){} }
    if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
      mediaRecorderRef.current.stop();
    }
    if (!recognitionRef.current) { setIsRecording(false); setVoiceState('idle'); }
  }, []);

  // Pre-load Whisper WASM script (lazy, on first mic click)
  const preloadWhisper = React.useCallback(() => {
    if (whisperStatus !== 'idle' || typeof Module !== 'undefined') return;
    setWhisperStatus('loading');
    const s = document.createElement('script');
    s.src = 'https://whisper.ggerganov.com/whisper.js';
    s.onload = () => setWhisperStatus('wasm_ready');
    s.onerror = () => setWhisperStatus('error');
    document.head.appendChild(s);
  }, [whisperStatus]);

  // ── TTS: read AI responses when enabled ──
  useEffect(() => {
    const lastMsg = messages[messages.length - 1];
    if (lastMsg && lastMsg.role === 'ai' && ttsEnabled) {
      speakText(lastMsg.text);
    }
  }, [messages, ttsEnabled, speakText]);

  // Stop TTS when user starts typing
  useEffect(() => {
    if (input && window.speechSynthesis) window.speechSynthesis.cancel();
  }, [input]);

  const sendMessage = async (text) => {
    if (cooldown > 0) return;
    const msg = text || input.trim();
    if (!msg) return;

    // Client-side rate check: max 15 queries per 60s
    const now = Date.now();
    const historyKey = 'housie_req_history';
    let history = [];
    try {
      history = JSON.parse(localStorage.getItem(historyKey) || '[]');
      history = history.filter(t => now - t < 60000);
    } catch (e) { history = []; }

    if (history.length >= 15) {
      const wait = Math.max(1, Math.ceil((60000 - (now - history[0])) / 1000));
      setCooldown(wait);
      setMessages(prev => [
        ...prev,
        { role: 'user', text: msg, time: timeNow() },
        { role: 'ai', text: `⏳ **Rate limit active!** You are asking questions too fast (max 15/min). Please wait **${wait} seconds** before continuing. 🛑`, time: timeNow() }
      ]);
      setInput('');
      return;
    }

    history.push(now);
    try { localStorage.setItem(historyKey, JSON.stringify(history)); } catch (e) {}

    // Short 2s anti-spam cooldown between requests
    setCooldown(2);

    setInput('');
    setMessages(prev => [...prev, { role: 'user', text: msg, time: timeNow() }]);

    // Show thinking animation
    setIsTyping(true);
    const thinkPhrases = ['Soch raha hoon... 🤔', 'Calculating... 📐', 'Processing... ⚡', 'Ek second... 🧠'];
    setSpeech(thinkPhrases[Math.floor(Math.random() * thinkPhrases.length)]);
    setShowSpeech(true);

    // 1. Native Desktop / Electron Computer Control Check
    if (window.electronAPI && window.electronAPI.executeControlCommand) {
      try {
        const ctrlRes = await window.electronAPI.executeControlCommand(msg);
        if (ctrlRes && ctrlRes.plan && ctrlRes.plan.length > 0) {
          const planText = ctrlRes.plan.map((s, idx) => `• **Step ${idx+1}:** \`${s.tool}(${JSON.stringify(s.args)})\``).join('\n');
          setIsTyping(false);
          setMessages(prev => [...prev, {
            role: 'ai',
            text: `🖥️ **Desktop Computer Action Executed** (${(ctrlRes.platform||'OS').toUpperCase()}):\n${planText}\n\n✅ Automation executed successfully!`,
            time: timeNow()
          }]);
          setSpeech('Executed! ⚡');
          setTalking(true);
          setTimeout(() => { setTalking(false); setShowSpeech(false); }, 2200);
          return;
        }
      } catch (e) {}
    }

    // 2. Python OS Controller Localhost Bridge (localhost:5000)
    try {
      const localRes = await fetch('http://127.0.0.1:5000/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, execute: true })
      });
      if (localRes.ok) {
        const ctrlData = await localRes.json();
        if (ctrlData.plan && ctrlData.plan.length > 0) {
          const planText = ctrlData.plan.map((s, idx) => `• **Step ${idx+1}:** \`${s.tool}(${JSON.stringify(s.args)})\``).join('\n');
          setIsTyping(false);
          setMessages(prev => [...prev, {
            role: 'ai',
            text: `🤖 **OS Control Action Executed** (${(ctrlData.platform||'Windows').toUpperCase()}):\n${planText}\n\n✅ Executed on host system!`,
            time: timeNow()
          }]);
          setSpeech('Executed! ⚡');
          setTalking(true);
          setTimeout(() => { setTalking(false); setShowSpeech(false); }, 2200);
          return;
        }
      }
    } catch(e) {}

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      const data = await res.json();

      // Handle backend 429 Rate Limit
      if (res.status === 429 || data.error === 'rate_limit_exceeded') {
        const wait = data.retry_after || 60;
        setCooldown(wait);
        setIsTyping(false);
        setMessages(prev => [...prev, { role: 'ai', text: data.response, time: timeNow() }]);
        setSpeech('Limit reached! 🛑');
        setTalking(true);
        setTimeout(() => { setTalking(false); setShowSpeech(false); }, 2500);
        return;
      }

      // Wait a tiny bit for dramatic effect
      await new Promise(r => setTimeout(r, 300 + Math.random() * 500));

      setIsTyping(false);
      setMessages(prev => [...prev, { role: 'ai', text: data.response, action: data.action, time: timeNow() }]);
      setLangMode(data.language === 'hinglish' ? '🇮🇳 Hinglish' : '🌐 English');

      // Auto-launch action URL if returned
      if (data.action && data.action.url) {
        setTimeout(() => {
          try { window.open(data.action.url, '_blank'); } catch (e) {}
        }, 400);
      }

      // Robot reply animation
      const donePhrases = ['Yeh lo! ✅', 'Got it! 😊', 'Done! ⚡', 'Dekho! 🎯'];
      setSpeech(donePhrases[Math.floor(Math.random() * donePhrases.length)]);
      setTalking(true);
      setTimeout(() => { setTalking(false); setShowSpeech(false); }, 2200);
    } catch (err) {
      // Graceful client-side fallback engine
      const clientRes = getFallbackResponse(msg);
      await new Promise(r => setTimeout(r, 400));
      setIsTyping(false);
      setMessages(prev => [...prev, { role: 'ai', text: clientRes.response, action: clientRes.action, time: timeNow() }]);
      setLangMode(clientRes.language === 'hinglish' ? '🇮🇳 Hinglish' : '🌐 English');
      if (clientRes.action && clientRes.action.url) {
        setTimeout(() => {
          try { window.open(clientRes.action.url, '_blank'); } catch (e) {}
        }, 400);
      }
      setSpeech('Yeh lo! ✅');
      setTalking(true);
      setTimeout(() => { setTalking(false); setShowSpeech(false); }, 2200);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (cooldown <= 0 && input.trim()) {
        sendMessage();
      }
    }
  };

  return (
    <React.Fragment>
      {/* Robot Panel */}
      <div className="robot-panel">
        <div className="glass robot-glass">
          <div className={`robot-speech ${showSpeech ? 'show' : ''}`}>{speech}</div>
          <div className={`robot-body ${talking ? 'talking' : ''}`}>
            <RobotSVG talking={talking} />
          </div>
          <div>
            <div className="robot-name">HOUSIE</div>
            <div className="robot-status"><span className="dot"></span> Online &amp; Ready</div>
          </div>
        </div>
      </div>

      {/* Chat Panel */}
      <div className="glass chat-panel">
        <div className="header">
          <div className="logo-ring"><span className="logo-icon">🧠</span></div>
          <div>
            <div className="header-title">Housie AI</div>
            <div className="header-sub">Python + React + SymPy Engine</div>
          </div>
          <span className="sympy-badge">⚡ SymPy</span>

          {/* Get App Quick Button */}
          <button
            className="get-app-btn"
            onClick={() => sendMessage('download app')}
            title="Download Housie AI for Windows, Mac, Linux & Android"
          >
            📲 Get App
          </button>

          {/* Speech Assist Button */}
          <a
            href="./speech-assist/index.html"
            className="get-app-btn"
            style={{textDecoration:'none', background:'linear-gradient(135deg,#6366f1,#4f46e5)', border:'none', color:'#fff', display:'inline-flex', alignItems:'center', gap:'4px'}}
            title="Open SpeechAssist — AI voice assistant"
          >
            🎙 Speech
          </a>

          {/* TTS Toggle */}
          <button
            className={`tts-btn ${ttsEnabled ? 'active' : ''}`}
            onClick={() => {
              if (ttsEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
              setTtsEnabled(v => !v);
            }}
            title={ttsEnabled ? 'TTS On — click to mute' : 'TTS Off — click to enable voice'}
          >
            {ttsEnabled ? '🔊' : '🔇'}
          </button>

          {/* Whisper Model Selector */}
          <select
            className="model-select"
            value={whisperModel}
            onChange={e => { setWhisperModel(e.target.value); whisperLoadingPromise = null; whisperCtx = null; setWhisperStatus('idle'); }}
            title="Whisper STT model"
          >
            <option value="tiny.en">🎙 tiny.en (75MB)</option>
            <option value="base">🌐 base (142MB)</option>
          </select>

          <span className="lang-badge">{langMode}</span>
        </div>

        <div className="messages">
          {messages.length === 0 ? (
            <div className="welcome">
              <div className="welcome-title">Hey! I'm Housie 🧠</div>
              <div className="welcome-sub">
                Powered by <strong>Python + SymPy</strong> — I can solve <strong>ANY math problem</strong>,
                text on <strong>WhatsApp</strong>, launch &amp; search <strong>any app</strong>, and explain 30+ science topics.
                Try me!
              </div>
              <div className="chips">
                {CHIPS.map((c, i) => (
                  <div key={i} className="chip" onClick={() => sendMessage(c)}>{c}</div>
                ))}
              </div>
            </div>
          ) : (
            messages.map((msg, i) => (
              <div key={i} className={`msg-row ${msg.role}`}>
                <div className={`avatar ${msg.role}`}>{msg.role === 'ai' ? '🧠' : '👤'}</div>
                <div className="msg-content">
                  <div className={`bubble ${msg.role}`} dangerouslySetInnerHTML={{ __html: formatText(msg.text) }} />
                  {msg.action && msg.action.type === 'download_app' ? (
                    <DownloadActionCard action={msg.action} />
                  ) : msg.action && msg.action.type === 'device' ? (
                    <DeviceActionCard action={msg.action} setMessages={setMessages} />
                  ) : msg.action && (
                    <div className="action-card">
                      <div className="action-card-header">
                        <span className="action-icon">{msg.action.icon || '🚀'}</span>
                        <div className="action-card-info">
                          <div className="action-app-name">{msg.action.app}</div>
                          <div className="action-app-desc">
                            {msg.action.phone ? `To: +${msg.action.phone}` : (msg.action.query ? `Search: "${msg.action.query}"` : msg.action.url)}
                          </div>
                        </div>
                      </div>
                      {msg.action.previewText && (
                        <div className="action-preview-text">
                          "{msg.action.previewText}"
                        </div>
                      )}
                      <a
                        href={msg.action.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className={`action-btn ${msg.action.type === 'whatsapp' ? 'whatsapp-btn' : ''}`}
                      >
                        {msg.action.label || 'Open Now ⚡'}
                      </a>
                    </div>
                  )}
                  <div className="timestamp">{msg.time}</div>
                </div>
              </div>
            ))
          )}

          {isTyping && (
            <div className="msg-row ai">
              <div className="avatar ai">🧠</div>
              <div className="msg-content">
                <div className="bubble ai">
                  <div className="typing-indicator">
                    <div className="typing-dot"></div>
                    <div className="typing-dot"></div>
                    <div className="typing-dot"></div>
                  </div>
                </div>
              </div>
            </div>
          )}
          <div ref={messagesEndRef} />
        </div>

        <div className="input-area">
          <textarea
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder={cooldown > 0 ? `⏳ Rate limit active: wait ${cooldown}s...` : voiceState === 'recording' ? '🎙️ Listening... click 🔴 to stop' : voiceState === 'transcribing' ? '🔄 Transcribing your voice...' : "Ask math, science, or say 'open youtube' / 'whatsapp hello' 🧠"}
            rows={1}
            disabled={cooldown > 0 || isTyping || voiceState === 'transcribing'}
          />

          {/* Mic Button */}
          <button
            className={`mic-btn ${isRecording ? 'recording' : ''} ${voiceState === 'transcribing' ? 'transcribing' : ''}`}
            onClick={() => {
              if (isRecording) { stopRecording(); }
              else { preloadWhisper(); startRecording(); }
            }}
            disabled={cooldown > 0 || voiceState === 'transcribing'}
            title={isRecording ? 'Click to stop recording' : `Voice input (${WHISPER_MODELS[whisperModel]?.size} Whisper model)`}
          >
            {voiceState === 'transcribing' ? '🔄' : isRecording ? '🔴' : '🎙️'}
          </button>

          <button
            className="send-btn"
            onClick={() => sendMessage()}
            disabled={cooldown > 0 || isTyping || !input.trim()}
            style={cooldown > 0 ? { minWidth: '56px', width: 'auto', borderRadius: '22px', padding: '0 10px', fontSize: '12px' } : {}}
          >
            {cooldown > 0 ? `⏳ ${cooldown}s` : '🚀'}
          </button>
        </div>

        {/* Whisper loading progress bar */}
        {whisperStatus === 'loading' && whisperPct > 0 && whisperPct < 100 && (
          <div style={{padding:'4px 20px 8px'}}>
            <div style={{fontSize:'10px',color:'#64748b',marginBottom:'3px'}}>🔄 Downloading Whisper {WHISPER_MODELS[whisperModel]?.name}... {whisperPct}%</div>
            <div style={{height:'3px',background:'rgba(255,255,255,0.08)',borderRadius:'4px',overflow:'hidden'}}>
              <div style={{height:'100%',width:`${whisperPct}%`,background:'linear-gradient(90deg,#6366f1,#a78bfa)',transition:'width 0.4s ease',borderRadius:'4px'}} />
            </div>
          </div>
        )}
      </div>

      {/* Voice status overlay */}
      {voiceState === 'recording' && (
        <div className="voice-status">🎙️ Listening... speak now, click 🔴 to stop</div>
      )}
      {voiceState === 'transcribing' && (
        <div className="voice-status">🔄 Transcribing with Whisper {whisperModel}...</div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HousieApp />);
</script>

<!-- Load speech synthesis voices eagerly & register PWA Service Worker -->
<script>
  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    window.speechSynthesis.getVoices();
  }

  // Register PWA Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    });
  }

  // Capture Android PWA install event for 1-tap installation
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.deferredInstallPrompt = e;
  });
</script>
