<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Housie AI: SymPy-powered math solver with 30+ science topics, bilingual English/Hinglish support" />

  <!-- React + Babel CDN for React without Node.js -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    ═══════════════════════════════════════════ */

      -webkit-backdrop-filter: blur(40px) saturate(1.6);

      transition: all 0.4s ease;
    }
    .robot-speech.show { opacity: 1; transform: translateY(0); }

    .robot-body {
      width: 120px; height: 150px; transition: transform 0.3s;
    }
    .robot-body.talking { animation: robotBounce 0.5s ease infinite alternate; }

    .robot-name {

      background: linear-gradient(135deg, #a78bfa 0%, #2dd4bf 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .robot-status {
      font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 6px;
    }
    .dot {
      width: 7px; height: 7px; background: #2dd4bf; border-radius: 50%;
      box-shadow: 0 0 8px #2dd4bf; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ═══════════════════════════════════════════
       CHAT PANEL (RIGHT)
    ═══════════════════════════════════════════ */
    .chat-panel {
      flex: 1; max-width: 720px; height: 92vh;
      display: flex; flex-direction: column;
      animation: fadeRight 0.8s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes fadeRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }

    .header {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);

    .logo-ring {

    /* Messages */
    .messages {

    .msg-row {

      animation: msgIn 0.4s cubic-bezier(0.22,1,0.36,1);

    @keyframes msgIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .avatar.ai { background: linear-gradient(135deg, #6366f1, #2dd4bf); }
    .avatar.user { background: linear-gradient(135deg, #f472b6, #a78bfa); }

    .msg-content { max-width: 80%; }
    .bubble {
      padding: 12px 16px; border-radius: 18px; font-size: 14px;
      line-height: 1.65; word-wrap: break-word;
    }
    .bubble.ai {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      border-top-left-radius: 4px; color: #e2e8f0;
    }
    .bubble.user {
      background: linear-gradient(135deg, rgba(99,102,241,0.35), rgba(167,139,250,0.25));
      border: 1px solid rgba(167,139,250,0.2);
      border-top-right-radius: 4px; color: #f1f5f9;
    }
    .bubble strong { color: #a5b4fc; font-weight: 600; }
    .timestamp { font-size: 10px; color: #475569; margin-top: 4px; padding: 0 6px; }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 5px; padding: 4px 2px; align-items: center; }
    .typing-dot {
      width: 7px; height: 7px; background: #a78bfa; border-radius: 50%;
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

    .math-result {
      display: inline-block; font-family: 'JetBrains Mono', monospace;
      font-size: 22px; font-weight: 700; color: #2dd4bf; margin: 6px 0;
      text-shadow: 0 0 20px rgba(45,212,191,0.4);
    }

    /* Welcome screen */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      padding: 30px; text-align: center;
    }
    .welcome-title {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #2dd4bf, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .welcome-sub { font-size: 13px; color: #94a3b8; max-width: 420px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
    .chip {
      padding: 8px 16px; border-radius: 20px; font-size: 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1; cursor: pointer; transition: all 0.2s;
    }
    .chip:hover {
      background: rgba(99,102,241,0.2); border-color: rgba(99,102,241,0.4);
      color: #a5b4fc; transform: translateY(-2px);
    }

    /* Input */
    .input-area {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; gap: 10px; align-items: flex-end;
    }
    .input-area textarea {
      flex: 1; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 12px 16px;
      color: #f1f5f9; font-size: 14px; font-family: 'Inter', sans-serif;
      resize: none; max-height: 100px; outline: none;
      transition: border-color 0.3s;
    }
    .input-area textarea::placeholder { color: #475569; }
    .input-area textarea:focus { border-color: rgba(99,102,241,0.5); }

    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      color: #fff; font-size: 18px; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
    .send-btn:active { transform: scale(0.95); }

    /* Mobile */
    @media (max-width: 768px) {
      #root { flex-direction: column; gap: 10px; padding: 10px; }
      .robot-panel { display: none; }
      .chat-panel { max-width: 100%; height: 100vh; }
    }
  </style>
</head>

<!-- Cloud Animation Script -->
<script>
(function initClouds() {
  const canvas = document.getElementById('cloud-canvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = canvas.parentElement.offsetWidth; canvas.height = canvas.parentElement.offsetHeight; }
  resize(); window.addEventListener('resize', resize);

  function drawPuff(x, y, r, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,255,255,${alpha})`);
    g.addColorStop(0.55, `rgba(255,255,255,${alpha * 0.6})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  const clouds = [
    {x:-300,y:canvas.height*0.08,speed:0.28,scale:1.1,alpha:0.55},
    {x:800,y:canvas.height*0.14,speed:0.18,scale:0.75,alpha:0.45},
    {x:1400,y:canvas.height*0.05,speed:0.22,scale:1.3,alpha:0.6},
    {x:300,y:canvas.height*0.19,speed:0.14,scale:0.6,alpha:0.35},
    {x:2100,y:canvas.height*0.10,speed:0.20,scale:0.9,alpha:0.5},
  ];
  const PUFFS = [{dx:0,dy:0,r:62},{dx:-70,dy:12,r:50},{dx:70,dy:10,r:50},{dx:-38,dy:-32,r:42},{dx:38,dy:-30,r:42},{dx:-115,dy:22,r:36},{dx:115,dy:22,r:36},{dx:0,dy:-52,r:34}];

  function drawCloud(c) {
    const sc = c.scale, W = canvas.width;
    const edgeFade = Math.min(1, Math.min((c.x+200)/200, (W-c.x+200)/200));
    const alpha = c.alpha * Math.max(0, edgeFade);
    if (alpha <= 0) return;
    PUFFS.forEach(p => drawPuff(c.x + p.dx*sc, c.y + p.dy*sc, p.r*sc, alpha));
  }

  let lastTime = 0;
  function animate(ts) {
    const dt = Math.min(ts - lastTime, 50); lastTime = ts;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    clouds.forEach(c => { c.x += c.speed*(dt/16); if(c.x > canvas.width+350) c.x = -350; drawCloud(c); });
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(animate); });
})();
</script>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

      <ellipse className="robot-eye" cx="68" cy="56" rx="8" ry="8" fill="#2dd4bf" style={{filter: talking ? 'drop-shadow(0 0 12px #2dd4bf) drop-shadow(0 0 24px #2dd4bf)' : 'drop-shadow(0 0 6px #2dd4bf)'}}>
        <animate attributeName="ry" values="8;1;8" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse className="robot-eye" cx="92" cy="56" rx="8" ry="8" fill="#2dd4bf" style={{filter: talking ? 'drop-shadow(0 0 12px #2dd4bf) drop-shadow(0 0 24px #2dd4bf)' : 'drop-shadow(0 0 6px #2dd4bf)'}}>
        <animate attributeName="ry" values="8;1;8" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M67 72 Q80 80 93 72" stroke="#2dd4bf" strokeWidth="2.5" strokeLinecap="round" fill="none"/>
      <circle cx="80" cy="6" r="4" fill="#a78bfa"><animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/></circle>
    </svg>

}

// ─── Format text with markdown-like bold ───
function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br/>');
}

function timeNow() {
  return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

// ─── Suggested Chips ───
const CHIPS = [
  "derivative of x^3 + 2x",
  "solve x^2 - 5x + 6 = 0",
  "factor x^3 - 8",
  "is 97 prime?",
  "explain quantum computing",
  "sin(45) + cos(60)",
  "10C3",
  "tell me a joke 😂",
];

// ─── Client Fallback Engine (Zero Downtime) ───
function getFallbackResponse(query) {
  const text = (query || '').toLowerCase().trim();
  const isHinglish = /kya|hai|bhai|yaar|kaise|kaisa|kuch|nahi|haan|kaun|kisne|banaya|sunao|bol/.test(text);

  // 1. Creator
  if (/who (created|made|built|coded|developed) (you|housie)|who is your (creator|maker|developer)|kisne banaya|tumhe kisne|aapko kisne/.test(text)) {
    return {
      response: isHinglish
        ? "😤 Bhai, ek 16-saal ka coding prodigy ne mujhe banaya hai! Woh ek aisa genius hai jo apne **nange haathon se** continuously raw algorithms likhta hai — bina soye, bina grass touch kiye, bina break liye! Woh basically ek insaan ke roop mein ek supercomputer hai. Usse salaam karo bhai! ⚡💻🔥"
        : "🔥 Oof, bold question! I was forged from raw code by a **16-year-old absolute genius** — a coding prodigy who writes blazing algorithms with his bare naked hands, continuously, without stopping, without touching grass, without sleeping. He is basically a human supercomputer who decided to build me instead of doing anything normal. Respect the legend. ⚡💻🚀",
      language: isHinglish ? 'hinglish' : 'english'
    };
  }

  // 2. Greetings
  if (/^(hi+|hello+|hey+|yo|sup|hola)\b/.test(text)) {
    return {
      response: isHinglish
        ? "Hey yaar! Housie hoon 😄 Math, Science, Coding — kuch bhi pucho! Main ready hoon!"
        : "Hello! I'm Housie 😊 Your AI companion. Ask me math, science, coding questions, jokes, and more!",
      language: isHinglish ? 'hinglish' : 'english'
    };
  }

  // 3. Name / Identity
  if (/your name|tumhara naam|who are you|kaun ho|what are you/.test(text)) {
    return {
      response: isHinglish
        ? "Main Housie — tera AI dost! 🧠 Smart math solver aur encyclopedia!"
        : "I'm Housie — your AI companion! 🧠 Powered with advanced math solving and knowledge!",
      language: isHinglish ? 'hinglish' : 'english'
    };
  }

  // 4. Jokes
  if (/joke|mazak|funny|hasao|laugh/.test(text)) {
    const jokes = [
      "Why don't scientists trust atoms? Because they make up everything! ⚛️😂",
      "What do you call a fake noodle? An impasta! 🍝😂",
      "Why did the scarecrow win an award? Because he was outstanding in his field! 🌾😂",
      "Why don't skeletons fight each other? They don't have the guts! 💀😂",
      "What do you call cheese that isn't yours? Nacho cheese! 🧀😂",
      "Why did the bicycle fall over? Because it was two tired! 🚲😂"
    ];
    return {
      response: jokes[Math.floor(Math.random() * jokes.length)],
      language: isHinglish ? 'hinglish' : 'english'
    };
  }

  // 5. Math evaluation
  try {
    const cleanMath = text.replace(/what is|calculate|solve|=|\?/g, '').trim();
    if (/^[0-9+\-*/^().\s%]+$/.test(cleanMath)) {
      const expr = cleanMath.replace(/\^/g, '**');
      const val = Function('"use strict";return (' + expr + ')')();
      if (typeof val === 'number' && !isNaN(val)) {
        return {
          response: `✅ **Result = ${Number.isInteger(val) ? val.toLocaleString() : val.toPrecision(8)}**\n\nNeed anything else solved? 😊`,
          language: isHinglish ? 'hinglish' : 'english'
        };
      }
    }
  } catch (e) {}

  // 6. Default Fallback
  return {
    response: isHinglish
      ? "Interesting sawal! 🧠 Math questions try karo jaise:\n• 15 * 45 + 120\n• who created you\n• tell me a joke 😂"
      : "Great question! 💡 Try asking me:\n• Math problems (e.g. 25 * 40 - 100)\n• Who created you?\n• Tell me a joke 😂",
    language: isHinglish ? 'hinglish' : 'english'
  };
}

// ─── Main App Component ───
function HousieApp() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const [talking, setTalking] = useState(false);
  const [speech, setSpeech] = useState('');
  const [showSpeech, setShowSpeech] = useState(false);
  const [langMode, setLangMode] = useState('🌐 English');
  const messagesEndRef = useRef(null);
  const inputRef = useRef(null);

  const scrollToBottom = () => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  };

  useEffect(() => { scrollToBottom(); }, [messages, isTyping]);

  const sendMessage = async (text) => {
    const msg = text || input.trim();
    if (!msg) return;

    setInput('');
    setMessages(prev => [...prev, { role: 'user', text: msg, time: timeNow() }]);

    // Show thinking animation
    setIsTyping(true);
    const thinkPhrases = ['Soch raha hoon... 🤔', 'Calculating... 📐', 'Processing... ⚡', 'Ek second... 🧠'];
    setSpeech(thinkPhrases[Math.floor(Math.random() * thinkPhrases.length)]);
    setShowSpeech(true);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      const data = await res.json();

      // Wait a tiny bit for dramatic effect
      await new Promise(r => setTimeout(r, 300 + Math.random() * 500));

      setIsTyping(false);
      setMessages(prev => [...prev, { role: 'ai', text: data.response, time: timeNow() }]);
      setLangMode(data.language === 'hinglish' ? '🇮🇳 Hinglish' : '🌐 English');

      // Robot reply animation
      const donePhrases = ['Yeh lo! ✅', 'Got it! 😊', 'Done! ⚡', 'Dekho! 🎯'];
      setSpeech(donePhrases[Math.floor(Math.random() * donePhrases.length)]);
      setTalking(true);
      setTimeout(() => { setTalking(false); setShowSpeech(false); }, 2200);
    } catch (err) {
      // Graceful client-side fallback engine
      const clientRes = getFallbackResponse(msg);
      await new Promise(r => setTimeout(r, 400));
      setIsTyping(false);
      setMessages(prev => [...prev, { role: 'ai', text: clientRes.response, time: timeNow() }]);
      setLangMode(clientRes.language === 'hinglish' ? '🇮🇳 Hinglish' : '🌐 English');
      setSpeech('Yeh lo! ✅');
      setTalking(true);
      setTimeout(() => { setTalking(false); setShowSpeech(false); }, 2200);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  return (
    <React.Fragment>
      {/* Robot Panel */}
      <div className="robot-panel">
        <div className="glass robot-glass">
          <div className={`robot-speech ${showSpeech ? 'show' : ''}`}>{speech}</div>
          <div className={`robot-body ${talking ? 'talking' : ''}`}>
            <RobotSVG talking={talking} />
          </div>
          <div>
            <div className="robot-name">HOUSIE</div>
            <div className="robot-status"><span className="dot"></span> Online &amp; Ready</div>
          </div>
        </div>
      </div>

      {/* Chat Panel */}
      <div className="glass chat-panel">
        <div className="header">
          <div className="logo-ring"><span className="logo-icon">🧠</span></div>
          <div>
            <div className="header-title">Housie AI</div>
            <div className="header-sub">Python + React + SymPy Engine</div>
          </div>
          <span className="sympy-badge">⚡ SymPy</span>
          <span className="lang-badge">{langMode}</span>
        </div>

        <div className="messages">
          {messages.length === 0 ? (
            <div className="welcome">
              <div className="welcome-title">Hey! I'm Housie 🧠</div>
              <div className="welcome-sub">
                Powered by <strong>Python + SymPy</strong> — I can solve <strong>ANY math problem</strong>!
                Derivatives, integrals, equations, factoring, prime checks, and 30+ science topics.
                Try me!
              </div>
              <div className="chips">
                {CHIPS.map((c, i) => (
                  <div key={i} className="chip" onClick={() => sendMessage(c)}>{c}</div>
                ))}
              </div>
            </div>
          ) : (
            messages.map((msg, i) => (
              <div key={i} className={`msg-row ${msg.role}`}>
                <div className={`avatar ${msg.role}`}>{msg.role === 'ai' ? '🧠' : '👤'}</div>
                <div className="msg-content">
                  <div className={`bubble ${msg.role}`} dangerouslySetInnerHTML={{ __html: formatText(msg.text) }} />
                  <div className="timestamp">{msg.time}</div>
                </div>
              </div>
            ))
          )}

          {isTyping && (
            <div className="msg-row ai">
              <div className="avatar ai">🧠</div>
              <div className="msg-content">
                <div className="bubble ai">
                  <div className="typing-indicator">
                    <div className="typing-dot"></div>
                    <div className="typing-dot"></div>
                    <div className="typing-dot"></div>
                  </div>
                </div>
              </div>
            </div>
          )}
          <div ref={messagesEndRef} />
        </div>

        <div className="input-area">
          <textarea
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder="Ask anything... math, science, coding 🧠"
            rows={1}
          />
          <button className="send-btn" onClick={() => sendMessage()}>🚀</button>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HousieApp />);
</script>

</body>
</html>
